apiVersion: v1
kind: Secret
metadata:
  name: db-creds
type: Opaque # type: Opaque is the default Secret type used for arbitrary user-defined data (passwords, API keys, etc.).
stringData: # Use stringData for plain text (K8s encodes it automatically)
  username: "admin"
  password: "supersecret"
# Alternative: use 'data' field with base64-encoded values
# data:
#   username: YWRtaW4=        # base64 of "admin"
#   password: c3VwZXJzZWNyZXQ= # base64 of "supersecret"
